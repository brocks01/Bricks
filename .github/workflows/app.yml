name: App checks

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, format, tests
        run: npm run check
      - name: Expo dependency health
        run: npx expo-doctor
      - name: Bundle for Android and iOS
        run: npx expo export --platform android --platform ios --output-dir dist
