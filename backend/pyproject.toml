[project]
name = "bricks-api"
version = "0.1.0"
description = "Bricks backend: one API for the app, WhatsApp and phone calls (docs/03)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "tzdata>=2024.2",
  "google-genai>=3.1.0",
  "twilio>=9.13.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bricks_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI's Depends(...) in defaults

[tool.ruff.lint.per-file-ignores]
# Message text in four languages: long lines and CJK / Tamil punctuation are the content.
"src/bricks_api/whatsapp/{i18n,templates,keywords}.py" = ["E501", "RUF001", "RUF002"]
"tests/test_whatsapp*.py" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Twilio ships no type hints.
module = ["twilio.*"]
ignore_missing_imports = true
